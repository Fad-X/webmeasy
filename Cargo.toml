[package]
name = "webmeasy"
version = "0.2.0"
edition = "2021"
authors = ["Security Researcher"]
description = "Web application enumeration tool for external attack surface mapping"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
clap = { version = "4", features = ["derive"] }
trust-dns-resolver = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
futures = "0.3"
anyhow = "1"
indicatif = "0.17"
time = { version = "0.3.55", features = ["formatting"] }
